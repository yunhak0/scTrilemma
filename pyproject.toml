[project]
name = "sctrilemma"
version = "1.0.0"
description = "Training, inference and evaluation code for scTrilemma."
readme = "README.md"
authors = [
    { name = "Yunhak Oh", email = "yunhak.oh@kaist.ac.kr" },
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "anndata>=0.12.6,<1",
    "cellxgene-census>=1.17.0,<2",
    "huggingface-hub>=0.25,<1",
    "hydra-core>=1.3.2,<2",
    "lightning>=2.6.0,<3",
    "matplotlib>=3.10,<4",
    "numpy>=2.0,<3",
    "omegaconf>=2.3,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<25",
    "pyensembl>=2.2.9,<3",
    "requests>=2.32,<3",
    "rich>=14.2.0,<15",
    "scanpy>=1.11.5,<2",
    "scib-metrics>=0.5.7,<1",
    "scikit-learn>=1.7.2,<2",
    "scipy>=1.14,<2",
    "setuptools>=80.9.0,<90",
    "tqdm>=4.66,<5",
    "wandb>=0.23.0,<1",
]

[project.scripts]
sctrilemma-train = "sctrilemma.train_vae:main"
sctrilemma-benchmark = "sctrilemma.benchmark.run:main"
sctrilemma-export-embeddings = "sctrilemma.benchmark.export_embeddings:main"
sctrilemma-download-metadata = "sctrilemma.preprocessing.download_metadata:main"
sctrilemma-download-census = "sctrilemma.preprocessing.download_census:cli"
sctrilemma-calculate-pseudobulk = "sctrilemma.preprocessing.calculate_pseudobulk:main"
sctrilemma-preprocess-cache = "sctrilemma.preprocessing.preprocess_cache:main"
sctrilemma-build-tissue-codes = "sctrilemma.preprocessing.build_tissue_codes:main"
sctrilemma-extend-tissue-codes = "sctrilemma.preprocessing.extend_tissue_codes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.37.1,<2",
    "ipykernel>=7.1.0,<8",
    "matplotlib>=3.10.7,<4",
    "pdfplumber>=0.11.9,<1",
    "pytest>=9.0.2,<10",
    "pytest-xdist>=3.8.0,<4",
    "ruff>=0.6.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sctrilemma"]

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "12.8"

[tool.pixi.dependencies]
cuda-version = "12.8.*"
cuda-toolkit = "12.8.*"

[tool.pixi.pypi-dependencies]
sctrilemma = { path = ".", editable = true }
faiss-gpu-cu12 = ">=1.13.2,<1.14"
jax = { version = ">=0.8.2,<0.9", extras = ["cuda12"] }
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.23.0", index = "https://download.pytorch.org/whl/cu128" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
download-checkpoint = "bash scripts/download_checkpoint.sh"
cuda-version = "nvcc --version"
torch-cuda-check = "python -c \"import torch; print(torch.__version__); print(torch.version.cuda); print(torch.cuda.is_available())\""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "ddp: marks tests requiring multi-process",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
